[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adult-swim-bumper"
version = "0.1.0"
description = "Adult Swim-style pre-roll bumper video generator CLI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["plex", "bumper", "adult-swim", "video", "cli", "pre-roll", "tunarr"]
dependencies = [
    "Pillow>=9.0",
    "PyYAML>=6.0",
]

[project.scripts]
bumper = "adult_swim_bumper.cli:main"

[project.urls]
Homepage = "https://github.com/joekarlsson/adult-swim-bumper"
