name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Check imports
        run: python -c "from adult_swim_bumper.cli import main; print('imports ok')"

      - name: Check version flag
        run: bumper --version

      - name: Check help
        run: bumper --help
